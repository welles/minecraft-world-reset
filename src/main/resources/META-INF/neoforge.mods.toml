license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Nico Welles"
displayTest = "IGNORE_SERVER_VERSION" # server-side only, clients do not need the mod
description = "Everything outside of claimed home areas regenerates some time after the last player left it."

[[mixins]]
config = "worldreset.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
